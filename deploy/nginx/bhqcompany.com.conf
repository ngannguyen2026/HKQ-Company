# Nginx config cho bhqcompany.com — site tĩnh build bởi Astro.
# Cài đặt: xem deploy/README.md (phần "Thiết lập server lần đầu").
# Certbot sẽ tự thêm block listen 443 + chứng chỉ SSL vào file này trên server.

# Cache-Control theo đường dẫn. Dùng map thay vì add_header trong từng location, vì nginx bỏ qua mọi
# add_header của cấp server khi location có add_header riêng (làm mất các header bảo mật bên dưới).
map $uri $bhq_cache_control {
    ~^/_astro/  "public, max-age=31536000, immutable";  # asset có hash trong tên file
    default     "no-cache";                             # HTML: luôn kiểm tra lại để thấy bản deploy mới
}

server {
    listen 80;
    listen [::]:80;
    server_name bhqcompany.com www.bhqcompany.com;

    # Thư mục `current` là symlink trỏ tới bản release mới nhất (do CI/CD cập nhật).
    root /var/www/bhqcompany/current;
    index index.html;

    location /_astro/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header Cache-Control $bhq_cache_control;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
