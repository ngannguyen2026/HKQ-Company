# Nginx config cho bhqcompany.com — site tĩnh build bởi Astro.
# Cài đặt: xem deploy/README.md (phần "Thiết lập server lần đầu").
# Certbot sẽ tự thêm block listen 443 + chứng chỉ SSL vào file này trên server.

server {
    listen 80;
    listen [::]:80;
    server_name bhqcompany.com www.bhqcompany.com;

    # Thư mục `current` là symlink trỏ tới bản release mới nhất (do CI/CD cập nhật).
    root /var/www/bhqcompany/current;
    index index.html;

    # Asset của Astro có hash trong tên file → cache lâu dài.
    location /_astro/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        # HTML luôn được kiểm tra lại để bản deploy mới hiển thị ngay.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml text/plain;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
